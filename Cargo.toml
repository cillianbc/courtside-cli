# The courtside CLI's source, published from the app's private repository.

[workspace]
resolver = "3"
members = [
    "crates/dvw-codec",
    "crates/vb-grammar",
    "crates/vb-engine",
    "crates/courtside-ffi",
    "crates/courtside-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/cillianbc/courtside-cli"
homepage = "https://github.com/cillianbc/courtside-cli"
publish = false

[workspace.dependencies]
dvw-codec = { path = "crates/dvw-codec" }
vb-grammar = { path = "crates/vb-grammar" }
vb-engine = { path = "crates/vb-engine" }
courtside-ffi = { path = "crates/courtside-ffi" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
insta = "1"
# PDF reading only: no dates, threads or images.
lopdf = { version = "0.36", default-features = false }
proptest = "1"
# bundled: the same SQLite on every platform, no system library.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
ulid = { version = "3", default-features = false }
unicode-normalization = "0.1"
# Pinned: the wasm-bindgen CLI that generates the JS glue must be this exact
# version (tools/wasm/build.sh).
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
